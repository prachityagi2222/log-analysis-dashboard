<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Analysis Dashboard</title>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #111827;
      --slate: #1e293b;
      --cyan: #06b6d4;
      --blue: #3b82f6;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, var(--slate) 0%, var(--bg) 65%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 48px 64px;
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 18px;
      background: rgba(17, 24, 39, 0.85);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .shield {
      width: 72px;
      height: 72px;
      animation: pulse 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(6, 182, 212, 0.55));
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.94); }
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 340px;
    }

    .bar {
      width: 260px;
      height: 4px;
      border-radius: 999px;
      background: var(--slate);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <svg class="shield" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2.5 4.5 5.4v6.1c0 4.6 3.1 8.6 7.5 10 4.4-1.4 7.5-5.4 7.5-10V5.4Z" fill="rgba(30,41,59,0.9)" />
      <path d="M12 6v12" stroke="#3b82f6" />
      <path d="M8.6 10h6.8" stroke="#3b82f6" />
    </svg>
    <h1>Log Analysis Dashboard</h1>
    <p>Starting the local analysis engine&hellip; nothing leaves your machine.</p>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
